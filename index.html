  ],
  3: [
    [ineq(x => Math.abs(tg(x)), '|tg x|', '<', '1', PI), '|tg x| < 1 ⇔ −1 < tg x < 1.'],
    [ineq(x => sq(tg)(x), 'tg²x', '≤', '3', PI), 'tg²x ≤ 3 ⇔ |tg x| ≤ √3.'],
    [and(ineq(tg, 'tg x', '>', '−1', PI), ineq(tg, 'tg x', '≤', '√3', PI)), 'Қос теңсіздікті жүйе ретінде жазамыз: tg x > −1 және tg x ≤ √3.'],
    [ineq(x => sq(tg)(x) - 1, 'tg²x − 1', '>', '0', PI), 'tg²x > 1 ⇔ |tg x| > 1.'],

    [ineq(x => R3 * sq(tg)(x) - 2 * tg(x) - R3, '√3 tg²x − 2 tg x − √3', '≥', '0', PI), 'Көбейткішке жіктейміз: (t − √3)(√3 t + 1) ≥ 0 ⇒ t ≤ −√3/3 немесе t ≥ √3.'],
    [ineq(x => tg(x) * (tg(x) + 1), 'tg x (tg x + 1)', '≥', '0', PI), 't(t + 1) ≥ 0 ⇒ t ≤ −1 немесе t ≥ 0.']
  ],
  4: [
    [ineq(x => Math.abs(ctg(x)), '|ctg x|', '≤', '1', PI), '|ctg x| ≤ 1 ⇔ −1 ≤ ctg x ≤ 1.'],
    [ineq(x => sq(ctg)(x), 'ctg²x', '≥', '3', PI), 'ctg²x ≥ 3 ⇔ |ctg x| ≥ √3.'],
    [and(ineq(ctg, 'ctg x', '≥', '−√3', PI), ineq(ctg, 'ctg x', '<', '1', PI)), 'Қос теңсіздікті жүйе ретінде жазамыз: ctg x ≥ −√3 және ctg x < 1.'],
    [ineq(x => sq(ctg)(x) - 1, 'ctg²x − 1', '<', '0', PI), 'ctg²x < 1 ⇔ |ctg x| < 1.'],
    [ineq(x => ctg(x) * (ctg(x) - 1), 'ctg x (ctg x − 1)', '>', '0', PI), 't(t − 1) > 0 ⇒ t < 0 немесе t > 1.'],
    [ineq(x => sq(ctg)(x) - (1 + R3) * ctg(x) + R3, 'ctg²x − (1 + √3) ctg x + √3', '≤', '0', PI), 'Түбірлері 1 және √3: (t − 1)(t − √3) ≤ 0 ⇒ 1 ≤ ctg x ≤ √3.'],
    [ineq(x => 3 * sq(ctg)(x) - 4 * R3 * ctg(x) + 3, '3ctg²x − 4√3 ctg x + 3', '>', '0', PI, 0), 'Түбірлері √3 және √3/3 (дискриминант 12): (t − √3)(3t − √3) > 0 ⇒ t < √3/3 немесе t > √3.']
  ]
};
for (const t of [1, 2, 3, 4]) CL[t].forEach(([c, s1]) => reg(t, 'C', 'dom', c, { s1, kind: NM[t] }));

/* ---- 5: күрделі аргумент ---- */
const PS = {
  sin: [['>', '1/2'], ['≤', '√2/2'], ['<', '−1/2'], ['≥', '√3/2'], ['>', '−√2/2'], ['≤', '0']],
  cos: [['<', '1/2'], ['≥', '−√2/2'], ['>', '√3/2'], ['≤', '−1/2'], ['<', '0'], ['≥', '√2/2']],

  A: [['2x', x => 2 * x, 't/2', 'x ∈ [0; 2π] ⇒ t ∈ [0; 4π]: шеңберді екі рет айналамыз, шешім екі рет қайталанады.'], ['x/2', x => x / 2, '2t', 'x ∈ [0; 2π] ⇒ t ∈ [0; π]: шеңбердің тек жартысы.']],
  B: [['3x', x => 3 * x, 't/3', 'x ∈ [0; 2π] ⇒ t ∈ [0; 6π]: шеңберді үш рет айналамыз.'], ['x + π/6', x => x + PI / 6, 't − π/6', 'Бұрыш π/6-ге ығысады, ал шешімдер солға π/6 ығысады.'], ['x − π/4', x => x - PI / 4, 't + π/4', 'Бұрыш π/4-ке кері ығысады, ал шешімдер оңға π/4 ығысады.']],
  C: [['2x − π/3', x => 2 * x - PI / 3, '(t + π/3)/2', 'Алдымен t үшін шешеміз, содан кейін π/3-ті қосып, 2-ге бөлеміз.'], ['2x + π/4', x => 2 * x + PI / 4, '(t − π/4)/2', 'Алдымен t үшін шешеміз, содан кейін π/4-ті алып тастап, 2-ге бөлеміз.'], ['x/2 + π/6', x => x / 2 + PI / 6, '2(t − π/6)', 'Алдымен t үшін шешеміз, содан кейін π/6-ны алып тастап, 2-ге көбейтеміз.']]
};
let jj = 0;
for (const lv of ['A', 'B', 'C']) {
  for (const [at, af, inv, note] of AR[lv]) {
    for (const name of ['sin', 'cos', 'tg', 'ctg']) {
      if (lv !== 'A' && (jj++ % 3 === 2)) continue;
      const [op, c] = PS[name][jj % 6];
      const gt = at.includes(' ') ? `${name} (${at})` : `${name} ${at}`;

        kind: name,
        s1: `t = ${at} деп белгілейміз. ${name} t ${op} ${c} теңсіздігін шешеміз (α = ${ARC[name]}(${c}) = ${alpha(name, c)}), содан кейін x = ${inv} арқылы қайтамыз. ${note}`,
        extras: [{ c: ineq(f, name + ' x', op, c, TP), tag: 'arg' }]
      });
    }
  }
}

/* ---- 6: күрделі ---- */
const I6 = (g, txt, op, c, T) => ineq(g, txt, op, c, T || TP);
const C6 = [
  ['A', I6(x => 2 * sq(cos)(x) + 3 * sin(x) - 3, '2cos²x + 3 sin x − 3', '≥', '0'), 'cos²x = 1 − sin²x қояміз ⇒ 2sin²x − 3 sin x + 1 ≤ 0 ⇒ 1/2 ≤ sin x ≤ 1.'],
  ['A', I6(x => 2 * sq(sin)(x) + cos(x) - 1, '2sin²x + cos x − 1', '>', '0'), 'sin²x = 1 − cos²x қояміз ⇒ 2cos²x − cos x − 1 < 0 ⇒ −1/2 < cos x < 1.'],
  ['A', I6(x => Math.cos(2 * x) + 5 * cos(x) + 3, 'cos 2x + 5 cos x + 3', '<', '0'), 'cos 2x = 2cos²x − 1 ⇒ 2cos²x + 5 cos x + 2 < 0 ⇒ (2t + 1)(t + 2) < 0 ⇒ −2 < cos x < −1/2.'],
  ['A', I6(x => Math.cos(2 * x) - 3 * sin(x) + 1, 'cos 2x − 3 sin x + 1', '≥', '0'), 'cos 2x = 1 − 2sin²x ⇒ 2sin²x + 3 sin x − 2 ≤ 0 ⇒ (2t − 1)(t + 2) ≤ 0 ⇒ sin x ≤ 1/2.'],
  ['A', I6(x => 2 * sq(sin)(x) - 5 * sin(x) + 2, '2sin²x − 5 sin x + 2', '≥', '0'), '(2t − 1)(t − 2) ≥ 0, ал sin x ≤ 1 болғандықтан t − 2 < 0 ⇒ 2t − 1 ≤ 0 ⇒ sin x ≤ 1/2.'],

  ['B', I6(x => 2 * sin(x) * cos(x), '2 sin x cos x', '>', '√2/2'), '2 sin x cos x = sin 2x ⇒ sin 2x > √2/2.'],

  ['C', I6(x => sin(x) - cos(x), 'sin x − cos x', '≤', '1'), 'sin x − cos x = √2 sin(x − π/4) ⇒ sin(x − π/4) ≤ √2/2.'],
  ['C', I6(x => cos(x) - sin(x), 'cos x − sin x', '≥', '0'), 'cos x − sin x = √2 cos(x + π/4) ⇒ cos(x + π/4) ≥ 0.'],
  ['C', I6(x => R3 * sin(x) + cos(x), '√3 sin x + cos x', '>', '1'), '√3 sin x + cos x = 2 sin(x + π/6) ⇒ sin(x + π/6) > 1/2.'],
  ['C', I6(x => sin(x) + R3 * cos(x), 'sin x + √3 cos x', '<', '1'), 'sin x + √3 cos x = 2 sin(x + π/3) ⇒ sin(x + π/3) < 1/2.'],
  ['C', I6(x => Math.pow(sin(x), 4) - Math.pow(cos(x), 4), 'sin⁴x − cos⁴x', '≥', '1/2'), 'sin⁴x − cos⁴x = (sin²x − cos²x)(sin²x + cos²x) = −cos 2x ⇒ cos 2x ≤ −1/2.'],
  ['C', I6(x => tg(x) * sin(x), 'tg x · sin x', '>', '0', TP), 'tg x · sin x = sin²x / cos x > 0 ⇒ cos x > 0 және sin x ≠ 0.'],
  ['C', I6(x => ctg(x) - tg(x), 'ctg x − tg x', '>', '0', TP), 'ctg x − tg x = 2 ctg 2x ⇒ ctg 2x > 0 (анықталу облысына назар аудар).'],
  ['C', I6(x => tg(x) + ctg(x), 'tg x + ctg x', '≥', '2', TP), 'tg x + ctg x = 2 / sin 2x ⇒ 2 / sin 2x ≥ 2 ⇔ 0 < sin 2x ≤ 1.']
];
C6.forEach(([lv, c, s1]) => reg(6, lv, 'dom', c, { s1, kind: 'other' }));

/* ---- 7: жүйелер ---- */
const S = (op, c) => ineq(sin, 'sin x', op, c, TP), C = (op, c) => ineq(cos, 'cos x', op, c, TP);

  ['tg (x + π/4)', x => tg(x + PI / 4), '>', '1', PI, 't = x + π/4: tg t > 1 ⇒ π/4 + πn < t < π/2 + πn. Соңында π/4-ті алып тастаймыз.'],
  ['ctg (x − π/3)', x => ctg(x - PI / 3), '≤', '√3/3', PI, 't = x − π/3: ctg t ≤ √3/3. Соңында π/3-ті қосамыз.'],

  [ineq(x => 2 * sq(cos)(x) + cos(x) - 1, '2cos²x + cos x − 1', '<', '0', TP), 't = cos x: 2t² + t − 1 < 0 ⇒ −1 < t < 1/2.'],
  [ineq(x => sin(x) + cos(x), 'sin x + cos x', '≥', '1', TP), 'sin x + cos x = √2 sin(x + π/4) ⇒ sin(x + π/4) ≥ √2/2.']
];
GC.forEach(([c, s1]) => reg(8, 'C', 'gen', c, { s1, kind: 'other' }));

/* ---- құрастыру ---- */
OI.bank = {}; OI.byId = {}; OI.dropped = [];

list.forEach(p => {

})();

/* ---- көмекшілер ---- */
const INF = Infinity, E = 1e-9;
const gt = (a, b) => a > b + E, ge = (a, b) => a >= b - E, lt = (a, b) => a < b - E, le = (a, b) => a <= b + E;
const lg = (x, b) => x > 0 ? Math.log(x) / Math.log(b) : NaN;
const log10 = x => x > 0 ? Math.log10(x) : NaN;
const I = (l, r, lc = false, rc = false) => ({ l, r, lc, rc });
const P = x => ({ l: x, r: x, lc: true, rc: true });
const num = v => {
  if (v === INF) return '+∞'; if (v === -INF) return '−∞';
  const neg = v < 0, a = Math.abs(v);
  let s;
  if (Math.abs(a - Math.round(a)) < 1e-9) s = String(Math.round(a));
  else { s = null; for (let d = 2; d <= 12; d++) { const n = a * d; if (Math.abs(n - Math.round(n)) < 1e-9) { s = Math.round(n) + '/' + d; break; } } if (!s) s = a.toFixed(3); }
  return (neg ? '−' : '') + s;
};
const fmtSet = ps => {
  if (!ps.length) return '∅';
  const a = ps.slice().sort((x, y) => x.l - y.l || x.r - y.r);
  if (a.every(p => p.l === p.r)) return `{${a.map(p => num(p.l)).join('; ')}}`;
  return a.map(p => p.l === p.r ? `{${num(p.l)}}` : `${p.lc ? '[' : '('}${num(p.l)}; ${num(p.r)}${p.rc ? ']' : ')'}`).join(' ∪ ');
};
const comp = ps => {
  const a = ps.slice().sort((x, y) => x.l - y.l), out = [];
  let pv = -INF, pc = true;
  const gap = (nl, nc) => { const lc = !pc, rc = !nc; if (pv < nl || (pv === nl && lc && rc && isFinite(pv))) out.push(pv === nl ? P(pv) : I(pv, nl, lc && isFinite(pv), rc && isFinite(nl))); };
  for (const p of a) { gap(p.l, p.lc); pv = p.r; pc = p.rc; }
  gap(INF, true);
  return out;
};
const inSet = (ps, x) => ps.some(p => (x > p.l && x < p.r) || (p.lc && x === p.l) || (p.rc && x === p.r));
const ends = ps => { const e = []; ps.forEach(p => { if (isFinite(p.l)) e.push(p.l); if (isFinite(p.r) && p.r !== p.l) e.push(p.r); }); return e; };

const GRID = (() => { const g = []; for (let x = -130; x <= 130; x += Math.abs(x) <= 30 ? 0.0137 : 0.071) g.push(x); return g; })();

function verifyIneq(pred, truth) {
  const es = ends(truth), near = x => es.some(e => Math.abs(x - e) < 2e-3);
  for (const x of GRID) { if (near(x)) continue; if (!!pred(x) !== inSet(truth, x)) return false; }
  for (const e of es) {
    const lo = e - 1e-4, hi = e + 1e-4;
    const okLo = es.some(f => f !== e && Math.abs(f - lo) < 2e-4);
    if (!okLo && !!pred(lo) !== inSet(truth, lo)) return false;
    const okHi = es.some(f => f !== e && Math.abs(f - hi) < 2e-4);
    if (!okHi && !!pred(hi) !== inSet(truth, hi)) return false;
  }
  for (const p of truth) {
    for (const [v, c] of [[p.l, p.lc], [p.r, p.rc]]) if (isFinite(v) && !!pred(v) !== !!c) return false;
    if (p.l !== p.r) { const m = isFinite(p.l) ? (isFinite(p.r) ? (p.l + p.r) / 2 : p.l + 1) : (isFinite(p.r) ? p.r - 1 : 0); if (!pred(m)) return false; }
  }
  return true;
}
function verifyEq(g, truth) {
  const roots = [];
  let pa = null, ga = NaN;
  for (const x of GRID) {
    const gx = g(x);
    if (Number.isFinite(gx) && Number.isFinite(ga) && ((ga < 0 && gx > 0) || (ga > 0 && gx < 0))) {
      let lo = pa, hi = x, glo = ga;
      for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2, gm = g(m); if (!Number.isFinite(gm)) break; if ((gm < 0) === (glo < 0)) { lo = m; glo = gm; } else hi = m; }
      const m = (lo + hi) / 2, gm = g(m);
      if (Number.isFinite(gm) && Math.abs(gm) < 1e-6) roots.push(m);
    } else if (Number.isFinite(gx) && Math.abs(gx) < 1e-12) roots.push(x);
    pa = x; ga = gx;
  }
  const uniq = []; roots.sort((a, b) => a - b).forEach(r => { if (!uniq.length || r - uniq[uniq.length - 1] > 1e-3) uniq.push(r); });
  const tr = truth.map(p => p.l).sort((a, b) => a - b);
  if (uniq.length !== tr.length) return false;
  return tr.every((r, i) => Math.abs(r - uniq[i]) < 1e-5 && Math.abs(g(r)) < 1e-7);
}

/* ---- ұқсамайтын қате жауаптар ---- */
function candsR(truth, eq, extras) {
  const out = [], add = (ps, tag) => out.push({ s: fmtSet(ps), tag });
  const flip = ps => ps.map(p => p.l === p.r ? p : I(p.l, p.r, isFinite(p.l) ? !p.lc : false, isFinite(p.r) ? !p.rc : false));
  const shift = d => truth.map(p => p.l === p.r ? P(p.l + d) : I(p.l + d, p.r + d, p.lc, p.rc));
  const shiftF = d => truth.map(p => p.l === p.r ? P(p.l + d) : I(isFinite(p.l) ? p.l + d : p.l, isFinite(p.r) ? p.r + d : p.r, p.lc, p.rc));
  if (eq) {
    if (truth.length >= 2) { add(truth.slice(1), 'r_partial'); add(truth.slice(0, -1), 'r_partial'); }
    add(truth.map(p => P(-p.l)), 'r_neg');
    add(shift(1), 'r_root'); add(shift(-1), 'r_root');
  } else {
    add(comp(truth), 'r_compl');
    add(flip(truth), 'r_strict');
    if (truth.length >= 2) { add(truth.slice(1), 'r_partial'); add(truth.slice(0, -1), 'r_partial'); }
    add(shiftF(1), 'r_root'); add(shiftF(-1), 'r_root');
  }
  for (const e of extras || []) add(e.ps, e.tag);
  if (eq) { add(truth.map(p => P(p.l * 2)), 'r_root'); add(truth.map(p => P(p.l + 2)), 'r_root'); }
  const truthS = fmtSet(truth), seen = new Map();
  for (const o of out) if (o.s !== truthS && !seen.has(o.s)) seen.set(o.s, o.tag);
  return { truthS, map: seen };
}

const list = [], cnt = {};
function reg(topic, level, type, lines, f, truth, steps, o = {}) {
  const k = topic + level; cnt[k] = (cnt[k] || 0) + 1;
  list.push({ id: `t${topic}${level}${String(cnt[k]).padStart(2, '0')}`, topic, level, type, lines: [].concat(lines), f, truth, steps, h1: o.h, extras: o.extras });
}
const E_ = (ps, tag) => ({ ps, tag });

function buildR(p) {
  const eq = p.type === 'eq';
  if (!(eq ? verifyEq(p.f, p.truth) : verifyIneq(p.f, p.truth))) return null;
  const { truthS, map } = candsR(p.truth, eq, p.extras);
  const rnd = OI.rng(p.id);
  const sh = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pool = sh([...map.entries()]), picked = [], tags = new Set();
  const prio = t => (t === 'base' || t === 'dom' || t === 'ext' || t === 'sub') ? 0 : 1;
  pool.sort((a, b) => prio(a[1]) - prio(b[1]));
  for (const [s, t] of pool) if (!tags.has(t) && picked.length < 3) { picked.push([s, t]); tags.add(t); }
  for (const [s, t] of pool) if (picked.length < 3 && !picked.find(x => x[0] === s)) picked.push([s, t]);
  if (picked.length < 3) return null;
  const opts = sh([[truthS, null], ...picked]);
  const ans = opts.findIndex(o => o[1] === null);
  const steps = p.steps.concat([`Жауабы: ${truthS}`]);
  const hints = [p.h1 || 'Алгоритм: 1) анықталу облысын жаз; 2) екі жағын бір негізге келтір (не алмастыру енгіз); 3) негіз 1-ден кіші болса, теңсіздік белгісін ауыстыр; 4) жауапты ОДЗ-мен салыстыр.', steps[1] || steps[0]];
  return {
    id: p.id, topic: p.topic, level: p.level, mode: 'real', head: eq ? 'Теңдеуді шешіңіз:' : 'Теңсіздікті шешіңіз:', cond: null, lines: p.lines, kind: 'other',
    options: opts.map(o => o[0]), tagsByOpt: opts.map(o => o[1]), ans, truth: truthS, steps, hints, tagMap: map
  };
}

NICE.cos = NICE.sin; NICE.ctg = NICE.tg;

  <div id="ev" class="vals"></div><div id="es" class="sol"></div></div>
  <div class="card"><h2>Шеңберден қалай оқимыз?</h2><ol class="steps"><li>Теңсіздікті теңдеуге ауыстыр: функция = a. Түзу (немесе осьтегі нүкте) шеңберді қиып өтетін нүктелерді тап.</li><li>Бұл нүктелер шеңберді доғаларға бөледі.</li><li>Әр доғадан бір нүкте алып, теңсіздікті тексер. Орындалатын доға — жасыл.</li><li>Доғаның шеттерін бұрыш түрінде жаз, периодты қос.</li></ol>
  <p class="m">Тангенс үшін оң жақтағы тік ось — тангенстер осі, котангенс үшін жоғарғы көлденең ось — котангенстер осі. Көрсетілетін ось ауқымы −2…2.</p></div>`;
  const fnE = $('#ef'), opE = $('#eo'), aE = $('#ea'), tE = $('#et');
  function setRange() {
    const m = ES.fn === 'sin' || ES.fn === 'cos' ? 1 : 1.8;
    aE.min = -m; aE.max = m; ES.a = Math.max(-m, Math.min(m, ES.a)); aE.value = ES.a;
    $('#eq').innerHTML = NICE[ES.fn].map(([t, v], i) => `<button class="g sm" data-i="${i}">${esc(t)}</button>`).join('');
    $$('#eq button').forEach(b => b.onclick = () => { ES.a = NICE[ES.fn][+b.dataset.i][1]; aE.value = ES.a; draw(); });
  }
  const F = OI.fn, CMP = OI.CMP;
  function draw() {
    const f = F[ES.fn], R = 80, C = 170, a = ES.a, th = ES.th * Math.PI / 180;
    const ok = x => { const v = f(x); return v === v && CMP[ES.op](v, a); };
    const NS = 720, run = []; let cur = null;
    for (let i = 0; i < NS; i++) { const t = ok(i * 2 * Math.PI / NS); if (t && !cur) cur = [i, i]; else if (t) cur[1] = i; else if (cur) { run.push(cur); cur = null; } }
    if (cur) run.push(cur);
    const pt = (ang, r = R) => [C + r * Math.cos(ang), C - r * Math.sin(ang)];
    let s = `<line x1="10" y1="${C}" x2="330" y2="${C}" class="ax"/><line x1="${C}" y1="10" x2="${C}" y2="330" class="ax"/><circle cx="${C}" cy="${C}" r="${R}" class="cr"/>`;
    run.forEach(([i, j]) => { const pts = []; for (let k = i; k <= j + 1; k++) pts.push(pt(k * 2 * Math.PI / NS).map(v => v.toFixed(1)).join(',')); s += `<polyline points="${pts.join(' ')}" class="arc"/>`; });
    if (ES.fn === 'sin') s += `<line x1="${C - R - 12}" y1="${C - R * a}" x2="${C + R + 12}" y2="${C - R * a}" class="aux"/>`;
    if (ES.fn === 'cos') s += `<line x1="${C + R * a}" y1="${C - R - 12}" x2="${C + R * a}" y2="${C + R + 12}" class="aux"/>`;
    if (ES.fn === 'tg') {

      s += `<line x1="${C + R}" y1="10" x2="${C + R}" y2="330" class="ax2"/><line x1="${C + R}" y1="${y}" x2="${C + R}" y2="${up ? 10 : 330}" class="hl"/><line x1="${C - 1.2 * R}" y1="${C + 1.2 * R * a}" x2="${C + 1.2 * R}" y2="${C - 1.2 * R * a}" class="aux"/><circle cx="${C + R}" cy="${y}" r="4" class="mk"/>`;
      const tv = Math.tan(th); if (isFinite(tv) && Math.abs(tv) <= 2) { const p = pt(th); s += `<line x1="${C}" y1="${C}" x2="${C + R}" y2="${C - R * tv}" class="ray"/><circle cx="${C + R}" cy="${C - R * tv}" r="4" class="pt"/>`; }
    }
    if (ES.fn === 'ctg') {
      const x = C + R * a, up = ES.op === '>' || ES.op === '≥';
      s += `<line x1="10" y1="${C - R}" x2="330" y2="${C - R}" class="ax2"/><line x1="${x}" y1="${C - R}" x2="${up ? 330 : 10}" y2="${C - R}" class="hl"/><line x1="${C - 1.2 * R * a}" y1="${C + 1.2 * R}" x2="${C + 1.2 * R * a}" y2="${C - 1.2 * R}" class="aux"/><circle cx="${x}" cy="${C - R}" r="4" class="mk"/>`;
      const cv = Math.cos(th) / Math.sin(th); if (isFinite(cv) && Math.abs(cv) <= 2) s += `<line x1="${C}" y1="${C}" x2="${C + R * cv}" y2="${C - R}" class="ray"/><circle cx="${C + R * cv}" cy="${C - R}" r="4" class="pt"/>`;
    }
    const P = pt(th);
    s += `<line x1="${C}" y1="${C}" x2="${P[0]}" y2="${P[1]}" class="rad"/><line x1="${P[0]}" y1="${P[1]}" x2="${P[0]}" y2="${C}" class="pj s"/><line x1="${P[0]}" y1="${P[1]}" x2="${C}" y2="${P[1]}" class="pj c"/><circle cx="${P[0]}" cy="${P[1]}" r="7" class="pt"/>`;
    s += `<text x="334" y="${C - 4}" class="lb" text-anchor="end">cos</text><text x="${C + 4}" y="20" class="lb">sin</text>`;
    $('#circ').innerHTML = s;
    // график
    const YM = ES.fn === 'sin' || ES.fn === 'cos' ? 1.3 : 3.2, W = 300, X0 = 20, H = 110, Y0 = 110;
    const gx = x => X0 + x / (2 * Math.PI) * W, gy = y => Y0 - y / YM * (H - 10);
    let g = '';
    run.forEach(([i, j]) => g += `<rect x="${gx(i * 2 * Math.PI / NS)}" y="10" width="${Math.max(1, gx((j + 1) * 2 * Math.PI / NS) - gx(i * 2 * Math.PI / NS))}" height="${2 * Y0 - 20}" class="shade"/>`);
    g += `<line x1="${X0}" y1="${Y0}" x2="${X0 + W}" y2="${Y0}" class="ax"/>`;
    ['0', 'π/2', 'π', '3π/2', '2π'].forEach((t, k) => g += `<line x1="${X0 + k * W / 4}" y1="${Y0 - 3}" x2="${X0 + k * W / 4}" y2="${Y0 + 3}" class="ax"/><text x="${X0 + k * W / 4}" y="${Y0 + 16}" class="lb" text-anchor="middle">${t}</text>`);
    if (Math.abs(a) <= YM) g += `<line x1="${X0}" y1="${gy(a)}" x2="${X0 + W}" y2="${gy(a)}" class="aux"/>`;
    let d = '', pen = false;
    for (let k = 0; k <= 720; k++) { const x = k * 2 * Math.PI / 720, y = f(x); if (y === y && Math.abs(y) <= YM) { d += (pen ? 'L' : 'M') + gx(x).toFixed(1) + ' ' + gy(y).toFixed(1); pen = true; } else pen = false; }
    g += `<path d="${d}" class="gr"/>`;
    const yv = f(th); g += `<line x1="${gx(th)}" y1="10" x2="${gx(th)}" y2="${2 * Y0 - 10}" class="rad" stroke-dasharray="3 3"/>` + (yv === yv && Math.abs(yv) <= YM ? `<circle cx="${gx(th)}" cy="${gy(yv)}" r="5" class="pt"/>` : '');
    g += `<text x="${X0}" y="12" class="lb">y = ${ES.fn} x,  y = a</text>`;
    $('#graph').innerHTML = g;
    // мәндер
    const n = v => isFinite(v) && Math.abs(v) < 1e6 ? v.toFixed(3).replace('-', '−') : '—';
    $('#av').textContent = a.toFixed(2).replace('-', '−'); $('#tv').textContent = ES.th + '° (≈ ' + (ES.th / 180).toFixed(3) + 'π)'; tE.value = ES.th;
    $('#ev').innerHTML = `<span><i class="c1"></i>sin x = <b>${n(Math.sin(th))}</b></span><span><i class="c2"></i>cos x = <b>${n(Math.cos(th))}</b></span><span>tg x = <b>${n(Math.tan(th))}</b></span><span>ctg x = <b>${n(Math.cos(th) / Math.sin(th))}</b></span><span class="${ok(th) ? 'yes' : 'no'}">${ES.fn} x ${ES.op} a: <b>${ok(th) ? 'орындалады ✓' : 'орындалмайды ✗'}</b></span>`;
    const ivs = run.map(([i, j]) => { const l = i === 0 ? 0 : (i - .5) * .5, r = j === NS - 1 ? 360 : (j + .5) * .5; const q = v => String(Math.round(v)); return `${i === 0 ? '[' : '('}${q(l)}°; ${q(r)}°${j === NS - 1 ? ']' : ')'}`; });
    $('#es').innerHTML = `<b>Шешім [0°; 360°] аралығында</b> (π = 180°, шамамен): ${ivs.length ? esc(ivs.join(' ∪ ')) : 'шешім жоқ'}`;
  }
  fnE.onchange = () => { ES.fn = fnE.value; setRange(); draw(); };
  opE.onchange = () => { ES.op = opE.value; draw(); };
  aE.oninput = () => { ES.a = +aE.value; draw(); };
  tE.oninput = () => { ES.th = +tE.value; draw(); };
  const svg = $('#circ');
  const move = e => { const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * 340 / r.width - 170, y = (e.clientY - r.top) * 340 / r.height - 170; ES.th = Math.round(((Math.atan2(-y, x) * 180 / Math.PI) + 360) % 360); draw(); };
  svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); move(e); svg.onpointermove = move; });
  svg.addEventListener('pointerup', () => { svg.onpointermove = null; });
  setRange(); draw();
};

const check = guard(async function () {

    ok = canon === p.truth; chosen = canon;

    if (ok) { PR.cs++; PR.ws = 0; if (PR.cs >= 3 && PR.lvl !== 'C') { PR.lvl = PR.lvl === 'A' ? 'B' : 'C'; PR.cs = 0; note = `Керемет! Деңгей көтерілді: ${PR.lvl}.`; } }
    else { PR.ws++; PR.cs = 0; if (PR.ws >= 2 && PR.lvl !== 'A') { PR.lvl = PR.lvl === 'C' ? 'B' : 'A'; PR.ws = 0; note = `Тапсырма жеңілдетілді: деңгей ${PR.lvl}. Бұл қалыпты, қадамдарды қара.`; } }
  }
  PR.res = `<div class="${ok ? 'good' : 'bad'}"><b>${ok ? `Дұрыс! +${PTS[p.level]} ұпай` : 'Қате.'}</b>${ok ? '' : `<br>Дұрыс жауап: <b>${esc(p.truth)}</b>`}${msg ? `<br><span class="why">Қатеңнің себебі: ${esc(msg)}</span>` : ''}${note ? `<br><i>${esc(note)}</i>` : ''}</div>
  <details open><summary>Толық шешу жолы</summary>${stepsHtml(p)}</details>`;
  renderProb();

});

const UB = { qs: null, ans: [], left: 1800, t0: 0 };
VIEWS.ubt = function () {
  UB.qs = null;
  main().innerHTML = `<div class="card"><h2>ҰБТ форматындағы тест</h2><p>20 сұрақ (6 есеп A деңгейі, 8 — B, 6 — C), өз тақырыптарыңнан. Уақыты — 30 минут. Нәтиже мұғалімге автоматты түрде жіберіледі.</p><button id="ub">Тестті бастау</button></div>`;
  $('#ub').onclick = ubtStart;
};
function ubtStart() {
  const take = (lv, n) => { const used = new Set(); const out = []; let g = 0; while (out.length < n && g++ < 500) { const mt = myTopics(), t = mt[(out.length + g) % mt.length]; const p = pick(OI.bank[t].filter(x => x.level === lv)); if (!used.has(p.id)) { used.add(p.id); out.push(p); } } return out; };
  const seen = new Set();
  UB.qs = [...take('A', 6), ...take('B', 8), ...take('C', 6)].filter(p => !seen.has(p.id) && seen.add(p.id));
  UB.ans = UB.qs.map(() => -1); UB.left = 1800; UB.t0 = Date.now();
  main().innerHTML = `<div class="bar"><span id="pg">0 / ${UB.qs.length}</span><span id="tt">30:00</span></div>
  ${UB.qs.map((p, i) => `<div class="card"><div class="meta">${i + 1}-сұрақ · деңгей ${p.level}</div><p>${esc(qHead(p))}</p>${mathHtml(p)}<div class="opts">${p.options.map((o, j) => `<button class="opt" data-i="${i}" data-j="${j}"><span class="ltr">${'ABCD'[j]}</span><span class="ot">${esc(o)}</span></button>`).join('')}</div></div>`).join('')}
  <button id="uf">Тестті аяқтау</button>`;
  main().onclick = e => { const b = e.target.closest('.opt'); if (!b) return; const i = +b.dataset.i; UB.ans[i] = +b.dataset.j; $$(`.opt[data-i="${i}"]`).forEach(x => x.classList.toggle('on', x === b)); $('#pg').textContent = UB.ans.filter(v => v >= 0).length + ' / ' + UB.qs.length; };
  const mm = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  timer = setInterval(() => { UB.left--; const t = $('#tt'); if (t) t.textContent = mm(UB.left); if (UB.left <= 0) ubtFinish(); }, 1000);
  $('#uf').onclick = () => { const u = UB.ans.filter(v => v < 0).length; if (!u || confirm('Жауап берілмеген сұрақ: ' + u + '. Аяқтайсыз ба?')) ubtFinish(); };
}
const ubtFinish = guard(async function () {
  clearInterval(timer); main().onclick = null;
  const sec = Math.min(1800, Math.round((Date.now() - UB.t0) / 1000));
  let score = 0; const rows = [];

    const p = UB.qs[i], j = UB.ans[i], ok = j === p.ans; if (ok) score++;
    if (j >= 0) {
      const rec = { qid: p.id, topic: p.topic, level: p.level, correct: ok, chosen: p.options[j], tag: ok ? null : p.tagsByOpt[j], kind: 'ubt' };
      S.att.push({ ...rec, id: uid(), user_id: S.me.id, created_at: new Date().toISOString() });
      DB.addAttempt(rec).catch(e => toast('Сақталмады: ' + e.message, true));
    }
    rows.push(`<div class="card ${ok ? 'okc' : 'noc'}"><div class="meta">${i + 1}-сұрақ · ${p.level}</div>${mathHtml(p)}<p>Сенің жауабың: <b>${j >= 0 ? esc(p.options[j]) : 'жауап берілмеді'}</b>${ok ? ' ✓' : `<br>Дұрыс жауап: <b>${esc(p.truth)}</b>${j >= 0 && p.tagsByOpt[j] ? `<br><span class="why">${esc(OI.TAGS[p.tagsByOpt[j]])}</span>` : ''}`}</p><details><summary>Шешу жолы</summary>${stepsHtml(p)}</details></div>`);
  }
  const t = { kind: 'ubt', score, total: UB.qs.length, seconds: sec };

  DB.addTest(t).catch(e => toast('Нәтиже серверге сақталмады: ' + e.message, true));

});

  }
  if (TS.tab === 'topics') {
    body = `<div class="card"><h2>Топқа тақырып ашу/жабу</h2><p class="m">Белгіленген тақырыптарды ғана сол топтың оқушысы көреді (практика, теория, формулалар, ҰБТ тест). Өзгерісті «Сақтау» арқылы бекітіңіз.</p></div>` + CFG.GROUPS.map((g, gi) => `<div class="card"><h2>${esc(g)} <span class="m">(${allS.filter(s => s.class === g).length} оқушы)</span></h2>${OI.TOPICS.map(t => `<label class="chk"><input type="checkbox" data-g="${gi}" value="${t.id}"${topicsOf(g).includes(t.id) ? ' checked' : ''}> ${t.id}. ${esc(t.name)}</label>`).join('')}<div class="actions"><button class="g sm" data-all="${gi}">Барлығын ашу</button><button data-save="${gi}">Сақтау</button></div></div>`).join('');
  }
  if (TS.tab === 'codes') {
    const act = g => (TS.codes || []).find(c => c.grp === g && c.active);
    body = `<div class="card"><h2>Тіркелу кодтары</h2><p class="m">Сайтқа тек кодты білетін адам тіркеле алады. Әр топтың өз коды бар: оқушы тіркелгенде кодты енгізеді де, сол топқа автоматты түседі. Код басқа адамға тарап кетсе, «Жаңа код жасау» басыңыз: ескі код бірден жарамсыз болады (тіркелген оқушылар кіре береді).</p></div>` + CFG.GROUPS.map((g, gi) => { const c = act(g); return `<div class="card"><h2>${esc(g)}</h2>${c ? `<div class="mth" style="font-size:26px;letter-spacing:2px;text-align:center">${esc(c.code)}</div><div class="actions"><button data-cp="${gi}">Көшіру</button><a class="btn g" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('KUANMATH: ' + location.href.split('#')[0] + '\nТіркелу коды (' + g + '): ' + c.code)}">WhatsApp</a><button class="g" data-nc="${gi}">Жаңа код жасау</button></div>` : `<p class="m">Код әлі жоқ.</p><div class="actions"><button data-nc="${gi}">Код жасау</button></div>`}</div>`; }).join('');
  }
  if (TS.tab === 'reg') {
    body = `<div class="card"><h2>Оқушыны тіркеу</h2><p class="m">Оқушы өзі де «Тіркелу» арқылы кіре алады. Мұнда оған логин мен құпиясөз беріп тіркейсіз.</p><form id="rf2"><label>Аты-жөні<input id="rn" required></label><label>Тобы<select id="rc" required>${grpOpts('')}</select></label><label>Логин (латынша)<input id="ru" required autocapitalize="none"></label><label>Құпиясөз<input id="rp" required minlength="6"></label><button type="submit">Тіркеу</button></form><p id="rm" class="m"></p></div>`;
  }
  const grpBar = `<div class="tabs t2 gb">${['', ...CFG.GROUPS].map(g => `<button class="${TS.grp === g ? 'on' : ''}" data-g="${esc(g)}">${g ? esc(g) + ' (' + allS.filter(s => s.class === g).length + ')' : 'Барлығы (' + allS.length + ')'}</button>`).join('')}</div>`;
  main().innerHTML = grpBar + `<div class="tabs t2">${tabs.map(([k, t]) => `<button class="${TS.tab === k ? 'on' : ''}" data-t="${k}">${t}</button>`).join('')}</div>${body}`;
  $$('.t2 button[data-t]').forEach(b => b.onclick = () => { TS.tab = b.dataset.t; teacherRender(); });
  $$('.gb button').forEach(b => b.onclick = () => { TS.grp = b.dataset.g; teacherRender(); });
  if ($('#xl')) $('#xl').onclick = () => {
    const head = ['Аты-жөні', 'Сынып', 'Тапсырма', 'Дұрыс', 'Қате', 'Пайыз', ...cols.map(t => 'Т' + t.id + ' ' + t.name), 'Соңғы тест', 'Қиналатын тақырыптар'];
    const lines = [head, ...rows.map(r => [r.s.full_name, r.s.class || '', r.st.n, r.st.c, r.st.w, r.st.n ? r.st.pct + '%' : '', ...cols.map(t => { const x = r.st.topics[t.id]; return x.n ? Math.round(100 * x.c / x.n) + '%' : ''; }), r.lt ? r.lt.score + '/' + r.lt.total : '', r.weak.map(i => 'Т' + i).join(' ')])];
    dl('kuanmath-results' + (TS.grp ? '-' + TS.grp : '') + '.csv', lines.map(l => l.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n'));
  };
  if ($('#gs')) $('#gs').onchange = guard(async e => { if (!e.target.value) return; await DB.setGroup(TS.sel, e.target.value); TS.data.all = (await DB.profiles()).filter(p => p.role !== 'teacher'); toast('Топ өзгертілді.'); teacherRender(); });
  if ($('#ds')) $('#ds').onclick = guard(async () => {
    const st = students.find(x => x.id === TS.sel); if (!st) return;
    if (!confirm(st.full_name + ' оқушысын және оның барлық нәтижесін өшіресіз бе? Қайтару мүмкін емес.')) return;
    await DB.delStudent(st.id); toast('Оқушы өшірілді.');
    TS.sel = ''; TS.data.all = (await DB.profiles()).filter(p => p.role !== 'teacher'); TS.data.att = await DB.allAttempts(); TS.data.tests = await DB.allTests(); TS.data.asg = await DB.assignments(); teacherRender();
  });
  $$('[data-nc]').forEach(b => b.onclick = guard(async () => { const g = CFG.GROUPS[+b.dataset.nc]; if (act0(g) && !confirm(g + ' тобының ескі коды жарамсыз болады. Жалғастырасыз ба?')) return; const c = await DB.newCode(g); TS.codes = await DB.codes(); toast('Жаңа код: ' + c); teacherRender(); }));
  $$('[data-cp]').forEach(b => b.onclick = guard(async () => { const g = CFG.GROUPS[+b.dataset.cp], c = (TS.codes || []).find(x => x.grp === g && x.active); const t = 'KUANMATH: ' + location.href.split('#')[0] + '\nТіркелу коды (' + g + '): ' + c.code; try { await navigator.clipboard.writeText(t); toast('Көшірілді.'); } catch (e) { prompt('Көшіріп алыңыз:', t); } }));
  $$('[data-all]').forEach(b => b.onclick = () => $$(`input[data-g="${b.dataset.all}"]`).forEach(c => c.checked = true));
  $$('[data-save]').forEach(b => b.onclick = guard(async () => {
    const g = CFG.GROUPS[+b.dataset.save], ids = $$(`input[data-g="${b.dataset.save}"]`).filter(c => c.checked).map(c => +c.value);
    if (!ids.length) { toast('Кемінде бір тақырып ашық болуы керек.', true); return; }
    await DB.setGroupTopics(g, ids); CFG.GROUP_TOPICS[g] = ids; toast(g + ': сақталды.');
  }));
  if ($('#rf')) $('#rf').onclick = () => VIEWS.teacher();
  if ($('#ss')) $('#ss').onchange = e => { TS.sel = e.target.value; teacherRender(); };
  if ($('#af2')) $('#af2').onsubmit = guard(async e => { e.preventDefault(); const who = $('#as').value; await DB.addAssignment({ user_id: who && !who.startsWith('g:') ? who : null, grp: who.startsWith('g:') ? who.slice(2) : null, topic: +$('#at').value, level: $('#al').value, count: +$('#ac').value || 10, note: $('#an').value.trim() }); toast('Тапсырма берілді.'); TS.data.asg = await DB.assignments(); teacherRender(); });
  $$('[data-d]').forEach(b => b.onclick = guard(async () => { await DB.delAssignment(b.dataset.d); TS.data.asg = await DB.assignments(); teacherRender(); }));
  if ($('#rf2')) $('#rf2').onsubmit = guard(async e => {
    e.preventDefault(); const u = normU($('#ru').value);
    if (!okU(u)) { toast('Логин: 3–30 таңба, тек латын әріптері мен сандар.', true); return; }
    await DB.createStudent(u, $('#rp').value, $('#rn').value.trim(), $('#rc').value.trim());
    $('#rm').textContent = `Тіркелді. Логин: ${u}, құпиясөз: ${$('#rp').value}. Оқушыға жіберіңіз.`; $('#rf2').reset();
    TS.data.all = (await DB.profiles()).filter(p => p.role !== 'teacher'); teacherRender();
  });
}

/* ================= Іске қосу ================= */
async function boot() {
  try { S.me = await DB.restore(); if (S.me) await loadMine(); } catch (e) { S.me = null; }
  route();
}
boot();
})();
</script></body></html>
