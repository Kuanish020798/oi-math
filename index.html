<script>/* OI engine: шешімдерді торда (π/72) есептеу, форматтау, тексеру, дистракторлар */
(function () {
'use strict';
const OI = globalThis.OI = globalThis.OI || {};
const PI = Math.PI, D = 72, N2 = 2 * D, EPS = 1e-9, R2 = Math.SQRT2 / 2, R3 = Math.sqrt(3);
const sin = Math.sin, cos = Math.cos;
const tg = x => Math.abs(cos(x)) < 1e-9 ? NaN : Math.tan(x);
const ctg = x => Math.abs(sin(x)) < 1e-9 ? NaN : cos(x) / sin(x);
OI.fn = { sin, cos, tg, ctg }; OI.D = D; OI.PI = PI;
const CMP = {
  '>': (a, c) => a > c + EPS, '≥': (a, c) => a >= c - EPS,
  '<': (a, c) => a < c - EPS, '≤': (a, c) => a <= c + EPS
};
OI.CMP = CMP;
const B = { '0': 0, '1/2': .5, '1/4': .25, '3/4': .75, '√2/2': R2, '√3/2': R3 / 2, '1': 1, '√3': R3, '√3/3': R3 / 3, '2': 2, '3': 3, '√2': Math.SQRT2 };
const val = t => t[0] === '−' ? -B[t.slice(1)] : B[t];
OI.val = val;

OI.ineq = (g, txt, op, ctxt, T, cn) => {
  const c = cn !== undefined ? cn : val(ctxt);
  return {
    g, op, c, T, lines: [txt + ' ' + op + ' ' + ctxt],
    f: x => { const v = g(x); return v === v && CMP[op](v, c); },
    dom: x => { const v = g(x); return v === v; }
  };
};
OI.and = (...cs) => ({
  T: Math.max(...cs.map(c => c.T)), parts: cs, lines: cs.flatMap(c => c.lines),
  f: x => cs.every(c => c.f(x)), dom: x => cs.every(c => c.dom(x))
});
const tr = (c, h) => ({ ...c, f: x => c.f(h(x)), dom: x => c.dom(h(x)) });

const xAt = i => i * PI / (2 * D);
const atoms = c => { const a = new Array(2 * N2 + 1); for (let i = 0; i < a.length; i++) a[i] = !!c.f(xAt(i)); return a; };
OI.atoms = atoms;

const gcd = (a, b) => b ? gcd(b, a % b) : a;
const fmtK = k => {
  if (k === 0) return '0';
  const g = gcd(k, D), n = k / g, d = D / g;
  const num = n === 1 ? 'π' : n + 'π';
  return d === 1 ? num : num + '/' + d;
};
OI.fmtK = fmtK;

function domIvs(a) {
  const out = []; let i = 0;
  while (i < a.length) {
    if (!a[i]) { i++; continue; }
    let j = i; while (j + 1 < a.length && a[j + 1]) j++;
    out.push({ l: i % 2 === 0 ? i / 2 : (i - 1) / 2, lc: i % 2 === 0, r: j % 2 === 0 ? j / 2 : (j + 1) / 2, rc: j % 2 === 0, single: i === j && i % 2 === 0 });
    i = j + 1;
  }
  return out;
}
const ivS = v => v.single ? `{${fmtK(v.l)}}` : `${v.lc ? '[' : '('}${fmtK(v.l)}; ${fmtK(v.r)}${v.rc ? ']' : ')'}`;
const domStr = a => { const v = domIvs(a); return v.length ? v.map(ivS).join(' ∪ ') : '∅'; };

function genStr(a, T) {
  const Nt = T === 2 * PI ? N2 : D, M = 2 * Nt, tn = T === 2 * PI ? '2πn' : 'πn';
  const s = a.slice(0, M);
  if (s.every(Boolean)) return 'x ∈ R';
  if (!s.some(Boolean)) return '∅';
  const term = k => k === 0 ? tn : `${fmtK(k)} + ${tn}`;
  const out = [];
  for (let st = 0; st < M; st++) {
    if (s[st] && !s[(st + M - 1) % M]) {
      let e = st; while (s[(e + 1) % M]) e++;
      const l = st % 2 === 0 ? st / 2 : (st - 1) / 2, lc = st % 2 === 0;
      const r = e % 2 === 0 ? e / 2 : (e + 1) / 2, rc = e % 2 === 0;
      out.push(st === e && st % 2 === 0 ? `{${term(l)}}` : `${lc ? '[' : '('}${term(l)}; ${term(r)}${rc ? ']' : ')'}`);
    }
  }
  return out.join(' ∪ ');
}
OI.domStr = domStr; OI.genStr = genStr;

/* оқушы жауабын талдау (тек [0;2π] режимі) */
function ek(t) {
  t = t.replace(/\s+/g, '').replace(/pi|Pi|PI|п|П/g, 'π').replace(/[−–—]/g, '-').replace(/\*/g, '');
  if (t === '0') return 0;
  let m = t.match(/^(\d+)?π(?:\/(\d+))?$/);
  let n, d;
  if (m) { n = m[1] ? +m[1] : 1; d = m[2] ? +m[2] : 1; }
  else { m = t.match(/^(\d+)\/(\d+)π$/); if (!m) return null; n = +m[1]; d = +m[2]; }
  const k = n * D / d; return Number.isInteger(k) && k >= 0 && k <= N2 ? k : null;
}
OI.parseDom = function (str) {
  str = String(str).trim();
  if (!str) return null;
  if (/^(∅|жоқ|empty)$/i.test(str)) return '∅';
  const pieces = str.replace(/∪|U|u|V|v|немесе|или/g, '|').split('|').map(s => s.trim()).filter(Boolean);
  const ivs = [];
  for (const p of pieces) {
    let m = p.match(/^\{(.+)\}$/) || p.match(/^x=(.+)$/);
    if (m) { const k = ek(m[1]); if (k === null) return null; ivs.push({ l: k, r: k, single: true }); continue; }
    m = p.match(/^([\[\(])(.+?)[;,](.+?)([\]\)])$/);
    if (!m) return null;
    const l = ek(m[2]), r = ek(m[3]); if (l === null || r === null || l > r) return null;
    if (l === r) { if (m[1] === '[' && m[4] === ']') ivs.push({ l, r, single: true }); else return null; continue; }
    ivs.push({ l, r, lc: m[1] === '[', rc: m[4] === ']', single: false });
  }
  ivs.sort((x, y) => x.l - y.l);
  return ivs.map(ivS).join(' ∪ ');
};

/* тексеру: шешім тек тор нүктелерінде өзгереді және (gen режимінде) период дұрыс */
function verify(c, mode) {
  const a = atoms(c);
  for (let i = 1; i < a.length; i += 2) {

    [ineq(x => Math.abs(sin(x)), '|sin x|', '≥', '√3/2', PI), '|sin x| ≥ √3/2 ⇔ sin x ≥ √3/2 немесе sin x ≤ −√3/2.'],
    [ineq(x => 2 * sq(sin)(x) - sin(x) - 1, '2sin²x − sin x − 1', '≥', '0', TP), 't = sin x деп белгілейміз: 2t² − t − 1 ≥ 0 ⇒ (2t + 1)(t − 1) ≥ 0 ⇒ t ≤ −1/2 немесе t ≥ 1.'],
    [ineq(x => 2 * sq(sin)(x) - 3 * sin(x) + 1, '2sin²x − 3 sin x + 1', '<', '0', TP), 't = sin x деп белгілейміз: 2t² − 3t + 1 < 0 ⇒ (2t − 1)(t − 1) < 0 ⇒ 1/2 < t < 1.'],
    [ineq(x => 4 * sq(sin)(x) - 3, '4sin²x − 3', '>', '0', PI), '4sin²x > 3 ⇔ sin²x > 3/4 ⇔ |sin x| > √3/2.'],
    [ineq(sin, 'sin x', '≥', '1', TP), 'sin x ≤ 1 болғандықтан, sin x ≥ 1 тек sin x = 1 болғанда орындалады.'],
    [ineq(x => 2 * sq(sin)(x) + sin(x) - 1, '2sin²x + sin x − 1', '≤', '0', TP), 't = sin x деп белгілейміз: 2t² + t − 1 ≤ 0 ⇒ (2t − 1)(t + 1) ≤ 0 ⇒ −1 ≤ t ≤ 1/2.']
  ],
  2: [
    [and(ineq(cos, 'cos x', '≥', '−√2/2', TP), ineq(cos, 'cos x', '<', '1/2', TP)), 'Қос теңсіздікті жүйе ретінде жазамыз: cos x ≥ −√2/2 және cos x < 1/2.'],
    [ineq(x => Math.abs(cos(x)), '|cos x|', '≤', '√3/2', PI), '|cos x| ≤ √3/2 ⇔ −√3/2 ≤ cos x ≤ √3/2.'],
    [ineq(x => Math.abs(cos(x)), '|cos x|', '>', '1/2', PI), '|cos x| > 1/2 ⇔ cos x > 1/2 немесе cos x < −1/2.'],
    [ineq(x => 2 * sq(cos)(x) - cos(x) - 1, '2cos²x − cos x − 1', '>', '0', TP), 't = cos x деп белгілейміз: 2t² − t − 1 > 0 ⇒ (2t + 1)(t − 1) > 0 ⇒ t < −1/2 (t ≤ 1 болғандықтан, t > 1 мүмкін емес).'],
    [ineq(x => 4 * sq(cos)(x) - 3, '4cos²x − 3', '≤', '0', PI), '4cos²x ≤ 3 ⇔ |cos x| ≤ √3/2.'],
    [ineq(cos, 'cos x', '≥', '1', TP), 'cos x ≤ 1 болғандықтан, cos x ≥ 1 тек cos x = 1 болғанда орындалады.'],
    [ineq(x => 2 * sq(cos)(x) - 3 * cos(x) + 1, '2cos²x − 3 cos x + 1', '≤', '0', TP), 't = cos x деп белгілейміз: 2t² − 3t + 1 ≤ 0 ⇒ (2t − 1)(t − 1) ≤ 0 ⇒ 1/2 ≤ t ≤ 1.'],

  ],
  3: [
    [ineq(x => Math.abs(tg(x)), '|tg x|', '<', '1', PI), '|tg x| < 1 ⇔ −1 < tg x < 1.'],
    [ineq(x => sq(tg)(x), 'tg²x', '≤', '3', PI), 'tg²x ≤ 3 ⇔ |tg x| ≤ √3.'],
    [and(ineq(tg, 'tg x', '>', '−1', PI), ineq(tg, 'tg x', '≤', '√3', PI)), 'Қос теңсіздікті жүйе ретінде жазамыз: tg x > −1 және tg x ≤ √3.'],
    [ineq(x => sq(tg)(x) - 1, 'tg²x − 1', '>', '0', PI), 'tg²x > 1 ⇔ |tg x| > 1.'],
    [ineq(x => sq(tg)(x) - (1 + R3) * tg(x) + R3, 'tg²x − (1 + √3) tg x + √3', '<', '0', PI), 'Түбірлері 1 және √3 (Виет теоремасы): (t − 1)(t − √3) < 0 ⇒ 1 < tg x < √3.'],
    [ineq(x => R3 * sq(tg)(x) - 2 * tg(x) - R3, '√3 tg²x − 2 tg x − √3', '≥', '0', PI), 'Көбейткішке жіктейміз: (t − √3)(√3 t + 1) ≥ 0 ⇒ t ≤ −√3/3 немесе t ≥ √3.'],
    [ineq(x => tg(x) * (tg(x) + 1), 'tg x (tg x + 1)', '≥', '0', PI), 't(t + 1) ≥ 0 ⇒ t ≤ −1 немесе t ≥ 0.']
  ],
  4: [
    [ineq(x => Math.abs(ctg(x)), '|ctg x|', '≤', '1', PI), '|ctg x| ≤ 1 ⇔ −1 ≤ ctg x ≤ 1.'],
    [ineq(x => sq(ctg)(x), 'ctg²x', '≥', '3', PI), 'ctg²x ≥ 3 ⇔ |ctg x| ≥ √3.'],
    [and(ineq(ctg, 'ctg x', '≥', '−√3', PI), ineq(ctg, 'ctg x', '<', '1', PI)), 'Қос теңсіздікті жүйе ретінде жазамыз: ctg x ≥ −√3 және ctg x < 1.'],
    [ineq(x => sq(ctg)(x) - 1, 'ctg²x − 1', '<', '0', PI), 'ctg²x < 1 ⇔ |ctg x| < 1.'],
    [ineq(x => ctg(x) * (ctg(x) - 1), 'ctg x (ctg x − 1)', '>', '0', PI), 't(t − 1) > 0 ⇒ t < 0 немесе t > 1.'],
    [ineq(x => sq(ctg)(x) - (1 + R3) * ctg(x) + R3, 'ctg²x − (1 + √3) ctg x + √3', '≤', '0', PI), 'Түбірлері 1 және √3: (t − 1)(t − √3) ≤ 0 ⇒ 1 ≤ ctg x ≤ √3.'],
    [ineq(x => 3 * sq(ctg)(x) - 4 * R3 * ctg(x) + 3, '3ctg²x − 4√3 ctg x + 3', '>', '0', PI, 0), 'Түбірлері √3 және √3/3 (дискриминант 12): (t − √3)(3t − √3) > 0 ⇒ t < √3/3 немесе t > √3.']
  ]
};
for (const t of [1, 2, 3, 4]) CL[t].forEach(([c, s1]) => reg(t, 'C', 'dom', c, { s1, kind: NM[t] }));

/* ---- 5: күрделі аргумент ---- */
const PS = {
  sin: [['>', '1/2'], ['≤', '√2/2'], ['<', '−1/2'], ['≥', '√3/2'], ['>', '−√2/2'], ['≤', '0']],
  cos: [['<', '1/2'], ['≥', '−√2/2'], ['>', '√3/2'], ['≤', '−1/2'], ['<', '0'], ['≥', '√2/2']],
  tg: [['>', '1'], ['<', '√3/3'], ['≥', '−1'], ['≤', '√3'], ['>', '0'], ['<', '−√3/3']],
  ctg: [['>', '√3/3'], ['<', '1'], ['≥', '−1'], ['≤', '√3'], ['>', '0'], ['<', '−√3/3']]
};
const AR = {
  A: [['2x', x => 2 * x, 't/2', 'x ∈ [0; 2π] ⇒ t ∈ [0; 4π]: шеңберді екі рет айналамыз, шешім екі рет қайталанады.'], ['x/2', x => x / 2, '2t', 'x ∈ [0; 2π] ⇒ t ∈ [0; π]: шеңбердің тек жартысы.']],

  C: [['2x − π/3', x => 2 * x - PI / 3, '(t + π/3)/2', 'Алдымен t үшін шешеміз, содан кейін π/3-ті қосып, 2-ге бөлеміз.'], ['2x + π/4', x => 2 * x + PI / 4, '(t − π/4)/2', 'Алдымен t үшін шешеміз, содан кейін π/4-ті алып тастап, 2-ге бөлеміз.'], ['x/2 + π/6', x => x / 2 + PI / 6, '2(t − π/6)', 'Алдымен t үшін шешеміз, содан кейін π/6-ны алып тастап, 2-ге көбейтеміз.']]
};
let jj = 0;
for (const lv of ['A', 'B', 'C']) {
  for (const [at, af, inv, note] of AR[lv]) {
    for (const name of ['sin', 'cos', 'tg', 'ctg']) {
      if (lv !== 'A' && (jj++ % 3 === 2)) continue;
      const [op, c] = PS[name][jj % 6];
      const gt = at.includes(' ') ? `${name} (${at})` : `${name} ${at}`;
      const f = F[name];
      reg(5, lv, 'dom', ineq(x => f(af(x)), gt, op, c, TP), {
        kind: name,
        s1: `t = ${at} деп белгілейміз. ${name} t ${op} ${c} теңсіздігін шешеміз (α = ${ARC[name]}(${c}) = ${alpha(name, c)}), содан кейін x = ${inv} арқылы қайтамыз. ${note}`,
        extras: [{ c: ineq(f, name + ' x', op, c, TP), tag: 'arg' }]
      });
    }
  }
}

/* ---- 6: күрделі ---- */
const I6 = (g, txt, op, c, T) => ineq(g, txt, op, c, T || TP);
const C6 = [
  ['A', I6(x => 2 * sq(cos)(x) + 3 * sin(x) - 3, '2cos²x + 3 sin x − 3', '≥', '0'), 'cos²x = 1 − sin²x қояміз ⇒ 2sin²x − 3 sin x + 1 ≤ 0 ⇒ 1/2 ≤ sin x ≤ 1.'],
  ['A', I6(x => 2 * sq(sin)(x) + cos(x) - 1, '2sin²x + cos x − 1', '>', '0'), 'sin²x = 1 − cos²x қояміз ⇒ 2cos²x − cos x − 1 < 0 ⇒ −1/2 < cos x < 1.'],
  ['A', I6(x => Math.cos(2 * x) + 5 * cos(x) + 3, 'cos 2x + 5 cos x + 3', '<', '0'), 'cos 2x = 2cos²x − 1 ⇒ 2cos²x + 5 cos x + 2 < 0 ⇒ (2t + 1)(t + 2) < 0 ⇒ −2 < cos x < −1/2.'],
  ['A', I6(x => Math.cos(2 * x) - 3 * sin(x) + 1, 'cos 2x − 3 sin x + 1', '≥', '0'), 'cos 2x = 1 − 2sin²x ⇒ 2sin²x + 3 sin x − 2 ≤ 0 ⇒ (2t − 1)(t + 2) ≤ 0 ⇒ sin x ≤ 1/2.'],
  ['A', I6(x => 2 * sq(sin)(x) - 5 * sin(x) + 2, '2sin²x − 5 sin x + 2', '≥', '0'), '(2t − 1)(t − 2) ≥ 0, ал sin x ≤ 1 болғандықтан t − 2 < 0 ⇒ 2t − 1 ≤ 0 ⇒ sin x ≤ 1/2.'],
  ['A', I6(x => Math.abs(2 * sin(x) - 1), '|2 sin x − 1|', '<', '1'), '|2 sin x − 1| < 1 ⇔ −1 < 2 sin x − 1 < 1 ⇔ 0 < sin x < 1.'],
  ['A', I6(x => Math.abs(2 * cos(x) + 1), '|2 cos x + 1|', '≥', '1'), '|2 cos x + 1| ≥ 1 ⇔ 2 cos x + 1 ≥ 1 немесе 2 cos x + 1 ≤ −1 ⇔ cos x ≥ 0 немесе cos x ≤ −1.'],
  ['A', I6(x => sin(x) * cos(x), 'sin x cos x', '<', '0'), 'Көбейтінді теріс: sin x мен cos x таңбалары әртүрлі (II және IV ширек).'],
  ['B', I6(x => 2 * sin(x) * cos(x), '2 sin x cos x', '>', '√2/2'), '2 sin x cos x = sin 2x ⇒ sin 2x > √2/2.'],

  ['B', I6(x => sq(sin)(x) - sq(cos)(x), 'sin²x − cos²x', '>', '0'), 'sin²x − cos²x = −cos 2x ⇒ cos 2x < 0.'],
  ['B', I6(x => sin(x) * cos(x), 'sin x cos x', '≥', '1/4'), 'sin x cos x = (1/2) sin 2x ⇒ sin 2x ≥ 1/2.'],
  ['B', I6(x => sin(2 * x) - sin(x), 'sin 2x − sin x', '>', '0'), 'sin 2x = 2 sin x cos x ⇒ sin x (2 cos x − 1) > 0: көбейткіштердің таңбаларын салыстырамыз.'],
  ['B', I6(x => sin(x) * (2 * cos(x) - R3), 'sin x (2 cos x − √3)', '≤', '0'), 'Көбейткіштер: sin x және 2 cos x − √3. Нөлдері: sin x = 0 және cos x = √3/2. Аралықтар әдісін қолданамыз.'],
  ['B', I6(x => (2 * cos(x) - 1) * (2 * sin(x) + R3), '(2 cos x − 1)(2 sin x + √3)', '≥', '0'), 'Нөлдері: cos x = 1/2 және sin x = −√3/2. Әр аралықта көбейтіндінің таңбасын тексереміз.'],
  ['B', I6(x => sin(x) + cos(x), 'sin x + cos x', '>', '1'), 'sin x + cos x = √2 sin(x + π/4) ⇒ sin(x + π/4) > √2/2.'],
  ['C', I6(x => sin(x) - cos(x), 'sin x − cos x', '≤', '1'), 'sin x − cos x = √2 sin(x − π/4) ⇒ sin(x − π/4) ≤ √2/2.'],
  ['C', I6(x => cos(x) - sin(x), 'cos x − sin x', '≥', '0'), 'cos x − sin x = √2 cos(x + π/4) ⇒ cos(x + π/4) ≥ 0.'],
  ['C', I6(x => R3 * sin(x) + cos(x), '√3 sin x + cos x', '>', '1'), '√3 sin x + cos x = 2 sin(x + π/6) ⇒ sin(x + π/6) > 1/2.'],
  ['C', I6(x => sin(x) + R3 * cos(x), 'sin x + √3 cos x', '<', '1'), 'sin x + √3 cos x = 2 sin(x + π/3) ⇒ sin(x + π/3) < 1/2.'],
  ['C', I6(x => Math.pow(sin(x), 4) - Math.pow(cos(x), 4), 'sin⁴x − cos⁴x', '≥', '1/2'), 'sin⁴x − cos⁴x = (sin²x − cos²x)(sin²x + cos²x) = −cos 2x ⇒ cos 2x ≤ −1/2.'],
  ['C', I6(x => tg(x) * sin(x), 'tg x · sin x', '>', '0', TP), 'tg x · sin x = sin²x / cos x > 0 ⇒ cos x > 0 және sin x ≠ 0.'],
  ['C', I6(x => ctg(x) - tg(x), 'ctg x − tg x', '>', '0', TP), 'ctg x − tg x = 2 ctg 2x ⇒ ctg 2x > 0 (анықталу облысына назар аудар).'],
  ['C', I6(x => tg(x) + ctg(x), 'tg x + ctg x', '≥', '2', TP), 'tg x + ctg x = 2 / sin 2x ⇒ 2 / sin 2x ≥ 2 ⇔ 0 < sin 2x ≤ 1.']
];
C6.forEach(([lv, c, s1]) => reg(6, lv, 'dom', c, { s1, kind: 'other' }));

/* ---- 7: жүйелер ---- */
const S = (op, c) => ineq(sin, 'sin x', op, c, TP), C = (op, c) => ineq(cos, 'cos x', op, c, TP);
const Tg = (op, c) => ineq(tg, 'tg x', op, c, PI), Ct = (op, c) => ineq(ctg, 'ctg x', op, c, PI);
const SYS = [
  ['A', [S('>', '0'), C('>', '0')]],
  ['A', [S('<', '0'), C('>', '0')]],
  ['A', [S('≥', '1/2'), C('<', '0')]],
  ['A', [S('>', '−1/2'), S('<', '√2/2')]],

  ['A', [S('≤', '1/2'), C('≤', '−1/2')]],

  ['B', [Tg('<', '−1'), C('>', '0')]],
  ['B', [Ct('≥', '1'), C('<', '0')]],

  ['B', [ineq(x => sin(2 * x), 'sin 2x', '>', '0', PI), C('<', '0')]],
  ['B', [ineq(x => cos(2 * x), 'cos 2x', '≥', '1/2', PI), S('>', '0')]],
  ['B', [S('>', '1/2'), C('>', '1/2')]],
  ['B', [Tg('>', '0'), C('<', '√2/2')]],
  ['C', [ineq(x => 2 * sq(sin)(x) - sin(x) - 1, '2sin²x − sin x − 1', '<', '0', TP), C('≥', '0')]],
  ['C', [ineq(x => Math.abs(sin(x)), '|sin x|', '<', '1/2', PI), C('<', '0')]],
  ['C', [ineq(x => sin(x) * cos(x), 'sin x cos x', '>', '0', PI), Tg('<', '1')]],
  ['C', [ineq(x => cos(2 * x), 'cos 2x', '>', '0', PI), S('≥', '1/2')]],

];
SYS.forEach(([lv, cs]) => reg(7, lv, 'dom', and(...cs), { s1: 'Жүйенің әр теңсіздігін жеке шешіп, шешімдердің ортақ бөлігін (қиылысуын) аламыз.', kind: 'other' }));

/* ---- 8: жалпы шешім ---- */
const G8 = [
  ['A', 'sin', '>', '√2/2'], ['A', 'sin', '≤', '−1/2'], ['A', 'cos', '≥', '1/2'], ['A', 'cos', '<', '−√2/2'],

];

  kind: name,
  s1: `Бір периодтағы шешімді табамыз (α = ${ARC[name]}(${c}) = ${alpha(name, c)}), сосын период қосамыз: ${name === 'sin' || name === 'cos' ? '2πn' : 'πn'}, n ∈ Z.`
}));
const GB = [
  ['sin 2x', x => sin(2 * x), '>', '1/2', PI, 't = 2x деп белгілейміз: sin t > 1/2 ⇒ π/6 + 2πk < t < 5π/6 + 2πk. Содан кейін 2-ге бөлеміз: период π болады.'],
  ['cos 2x', x => cos(2 * x), '≤', '√2/2', PI, 't = 2x деп белгілейміз: cos t ≤ √2/2. Шешімді 2-ге бөлгенде период π болады.'],
  ['sin (x + π/3)', x => sin(x + PI / 3), '≥', '√3/2', TP, 't = x + π/3: sin t ≥ √3/2 ⇒ π/3 + 2πn ≤ t ≤ 2π/3 + 2πn. Соңында π/3-ті алып тастаймыз.'],
  ['cos (x − π/6)', x => cos(x - PI / 6), '<', '1/2', TP, 't = x − π/6: cos t < 1/2. Соңында π/6-ны қосамыз.'],
  ['tg (x + π/4)', x => tg(x + PI / 4), '>', '1', PI, 't = x + π/4: tg t > 1 ⇒ π/4 + πn < t < π/2 + πn. Соңында π/4-ті алып тастаймыз.'],
  ['ctg (x − π/3)', x => ctg(x - PI / 3), '≤', '√3/3', PI, 't = x − π/3: ctg t ≤ √3/3. Соңында π/3-ті қосамыз.'],
  ['−sin x', x => -sin(x), '>', '√2/2', TP, 'Екі жағын −1-ге көбейтеміз: sin x < −√2/2.'],

];

const GC = [
  [ineq(x => 2 * sq(sin)(x) - sin(x) - 1, '2sin²x − sin x − 1', '≥', '0', TP), 't = sin x: 2t² − t − 1 ≥ 0 ⇒ t ≤ −1/2 немесе t = 1.'],
  [ineq(x => Math.abs(sin(x)), '|sin x|', '<', '1/2', PI), '−1/2 < sin x < 1/2. Бұл теңсіздіктің периоды π.'],

/* ================= Интерактивті шеңбер ================= */
const ES = { fn: 'sin', op: '>', a: 0.5, th: 60 };
const NICE = { sin: [['−1', -1], ['−√3/2', -Math.sqrt(3) / 2], ['−√2/2', -Math.SQRT1_2], ['−1/2', -.5], ['0', 0], ['1/2', .5], ['√2/2', Math.SQRT1_2], ['√3/2', Math.sqrt(3) / 2], ['1', 1]], tg: [['−√3', -Math.sqrt(3)], ['−1', -1], ['−√3/3', -Math.sqrt(3) / 3], ['0', 0], ['√3/3', Math.sqrt(3) / 3], ['1', 1], ['√3', Math.sqrt(3)]] };
NICE.cos = NICE.sin; NICE.ctg = NICE.tg;
VIEWS.explain = function () {
  main().innerHTML = `<div class="card"><h2>Интерактивті тригонометриялық шеңбер</h2>
  <p class="m">Шеңберді сүйреп бұрышты өзгерт немесе төмендегі жүгірткіні қолдан. Жасыл бөлік — теңсіздіктің шешімі.</p>
  <div class="ctl"><label>Функция<select id="ef">${['sin', 'cos', 'tg', 'ctg'].map(f => `<option${f === ES.fn ? ' selected' : ''}>${f}</option>`).join('')}</select></label>
  <label>Белгі<select id="eo">${['>', '≥', '<', '≤'].map(o => `<option${o === ES.op ? ' selected' : ''}>${o}</option>`).join('')}</select></label>
  <label>a = <b id="av"></b><input type="range" id="ea" step="0.01"></label></div>
  <div class="quick" id="eq"></div>
  <div class="two"><svg id="circ" viewBox="0 0 340 340" class="viz"></svg><svg id="graph" viewBox="0 0 340 220" class="viz"></svg></div>
  <label class="blk">Бұрыш x = <b id="tv"></b><input type="range" id="et" min="0" max="360" step="1"></label>
  <div id="ev" class="vals"></div><div id="es" class="sol"></div></div>
  <div class="card"><h2>Шеңберден қалай оқимыз?</h2><ol class="steps"><li>Теңсіздікті теңдеуге ауыстыр: функция = a. Түзу (немесе осьтегі нүкте) шеңберді қиып өтетін нүктелерді тап.</li><li>Бұл нүктелер шеңберді доғаларға бөледі.</li><li>Әр доғадан бір нүкте алып, теңсіздікті тексер. Орындалатын доға — жасыл.</li><li>Доғаның шеттерін бұрыш түрінде жаз, периодты қос.</li></ol>
  <p class="m">Тангенс үшін оң жақтағы тік ось — тангенстер осі, котангенс үшін жоғарғы көлденең ось — котангенстер осі. Көрсетілетін ось ауқымы −2…2.</p></div>`;
  const fnE = $('#ef'), opE = $('#eo'), aE = $('#ea'), tE = $('#et');
  function setRange() {
    const m = ES.fn === 'sin' || ES.fn === 'cos' ? 1 : 1.8;
    aE.min = -m; aE.max = m; ES.a = Math.max(-m, Math.min(m, ES.a)); aE.value = ES.a;
    $('#eq').innerHTML = NICE[ES.fn].map(([t, v], i) => `<button class="g sm" data-i="${i}">${esc(t)}</button>`).join('');
    $$('#eq button').forEach(b => b.onclick = () => { ES.a = NICE[ES.fn][+b.dataset.i][1]; aE.value = ES.a; draw(); });
  }
  const F = OI.fn, CMP = OI.CMP;
  function draw() {
    const f = F[ES.fn], R = 80, C = 170, a = ES.a, th = ES.th * Math.PI / 180;
    const ok = x => { const v = f(x); return v === v && CMP[ES.op](v, a); };
    const NS = 720, run = []; let cur = null;
    for (let i = 0; i < NS; i++) { const t = ok(i * 2 * Math.PI / NS); if (t && !cur) cur = [i, i]; else if (t) cur[1] = i; else if (cur) { run.push(cur); cur = null; } }
    if (cur) run.push(cur);
    const pt = (ang, r = R) => [C + r * Math.cos(ang), C - r * Math.sin(ang)];
    let s = `<line x1="10" y1="${C}" x2="330" y2="${C}" class="ax"/><line x1="${C}" y1="10" x2="${C}" y2="330" class="ax"/><circle cx="${C}" cy="${C}" r="${R}" class="cr"/>`;
    run.forEach(([i, j]) => { const pts = []; for (let k = i; k <= j + 1; k++) pts.push(pt(k * 2 * Math.PI / NS).map(v => v.toFixed(1)).join(',')); s += `<polyline points="${pts.join(' ')}" class="arc"/>`; });
    if (ES.fn === 'sin') s += `<line x1="${C - R - 12}" y1="${C - R * a}" x2="${C + R + 12}" y2="${C - R * a}" class="aux"/>`;
    if (ES.fn === 'cos') s += `<line x1="${C + R * a}" y1="${C - R - 12}" x2="${C + R * a}" y2="${C + R + 12}" class="aux"/>`;
    if (ES.fn === 'tg') {
      const y = C - R * a, up = ES.op === '>' || ES.op === '≥';
      s += `<line x1="${C + R}" y1="10" x2="${C + R}" y2="330" class="ax2"/><line x1="${C + R}" y1="${y}" x2="${C + R}" y2="${up ? 10 : 330}" class="hl"/><line x1="${C - 1.2 * R}" y1="${C + 1.2 * R * a}" x2="${C + 1.2 * R}" y2="${C - 1.2 * R * a}" class="aux"/><circle cx="${C + R}" cy="${y}" r="4" class="mk"/>`;
      const tv = Math.tan(th); if (isFinite(tv) && Math.abs(tv) <= 2) { const p = pt(th); s += `<line x1="${C}" y1="${C}" x2="${C + R}" y2="${C - R * tv}" class="ray"/><circle cx="${C + R}" cy="${C - R * tv}" r="4" class="pt"/>`; }
    }
    if (ES.fn === 'ctg') {
      const x = C + R * a, up = ES.op === '>' || ES.op === '≥';
      s += `<line x1="10" y1="${C - R}" x2="330" y2="${C - R}" class="ax2"/><line x1="${x}" y1="${C - R}" x2="${up ? 330 : 10}" y2="${C - R}" class="hl"/><line x1="${C - 1.2 * R * a}" y1="${C + 1.2 * R}" x2="${C + 1.2 * R * a}" y2="${C - 1.2 * R}" class="aux"/><circle cx="${x}" cy="${C - R}" r="4" class="mk"/>`;
      const cv = Math.cos(th) / Math.sin(th); if (isFinite(cv) && Math.abs(cv) <= 2) s += `<line x1="${C}" y1="${C}" x2="${C + R * cv}" y2="${C - R}" class="ray"/><circle cx="${C + R * cv}" cy="${C - R}" r="4" class="pt"/>`;
    }
    const P = pt(th);
    s += `<line x1="${C}" y1="${C}" x2="${P[0]}" y2="${P[1]}" class="rad"/><line x1="${P[0]}" y1="${P[1]}" x2="${P[0]}" y2="${C}" class="pj s"/><line x1="${P[0]}" y1="${P[1]}" x2="${C}" y2="${P[1]}" class="pj c"/><circle cx="${P[0]}" cy="${P[1]}" r="7" class="pt"/>`;
    s += `<text x="334" y="${C - 4}" class="lb" text-anchor="end">cos</text><text x="${C + 4}" y="20" class="lb">sin</text>`;
    $('#circ').innerHTML = s;
    // график
    const YM = ES.fn === 'sin' || ES.fn === 'cos' ? 1.3 : 3.2, W = 300, X0 = 20, H = 110, Y0 = 110;
    const gx = x => X0 + x / (2 * Math.PI) * W, gy = y => Y0 - y / YM * (H - 10);
    let g = '';
    run.forEach(([i, j]) => g += `<rect x="${gx(i * 2 * Math.PI / NS)}" y="10" width="${Math.max(1, gx((j + 1) * 2 * Math.PI / NS) - gx(i * 2 * Math.PI / NS))}" height="${2 * Y0 - 20}" class="shade"/>`);
    g += `<line x1="${X0}" y1="${Y0}" x2="${X0 + W}" y2="${Y0}" class="ax"/>`;
    ['0', 'π/2', 'π', '3π/2', '2π'].forEach((t, k) => g += `<line x1="${X0 + k * W / 4}" y1="${Y0 - 3}" x2="${X0 + k * W / 4}" y2="${Y0 + 3}" class="ax"/><text x="${X0 + k * W / 4}" y="${Y0 + 16}" class="lb" text-anchor="middle">${t}</text>`);
    if (Math.abs(a) <= YM) g += `<line x1="${X0}" y1="${gy(a)}" x2="${X0 + W}" y2="${gy(a)}" class="aux"/>`;
    let d = '', pen = false;
    for (let k = 0; k <= 720; k++) { const x = k * 2 * Math.PI / 720, y = f(x); if (y === y && Math.abs(y) <= YM) { d += (pen ? 'L' : 'M') + gx(x).toFixed(1) + ' ' + gy(y).toFixed(1); pen = true; } else pen = false; }
    g += `<path d="${d}" class="gr"/>`;
    const yv = f(th); g += `<line x1="${gx(th)}" y1="10" x2="${gx(th)}" y2="${2 * Y0 - 10}" class="rad" stroke-dasharray="3 3"/>` + (yv === yv && Math.abs(yv) <= YM ? `<circle cx="${gx(th)}" cy="${gy(yv)}" r="5" class="pt"/>` : '');
    g += `<text x="${X0}" y="12" class="lb">y = ${ES.fn} x,  y = a</text>`;
    $('#graph').innerHTML = g;
    // мәндер
    const n = v => isFinite(v) && Math.abs(v) < 1e6 ? v.toFixed(3).replace('-', '−') : '—';
    $('#av').textContent = a.toFixed(2).replace('-', '−'); $('#tv').textContent = ES.th + '° (≈ ' + (ES.th / 180).toFixed(3) + 'π)'; tE.value = ES.th;
    $('#ev').innerHTML = `<span><i class="c1"></i>sin x = <b>${n(Math.sin(th))}</b></span><span><i class="c2"></i>cos x = <b>${n(Math.cos(th))}</b></span><span>tg x = <b>${n(Math.tan(th))}</b></span><span>ctg x = <b>${n(Math.cos(th) / Math.sin(th))}</b></span><span class="${ok(th) ? 'yes' : 'no'}">${ES.fn} x ${ES.op} a: <b>${ok(th) ? 'орындалады ✓' : 'орындалмайды ✗'}</b></span>`;
    // НАҚТЫ ЖАУАП: кестелік a үшін π арқылы дәл, басқа a үшін арк-функция арқылы
    const T = ES.fn === 'sin' || ES.fn === 'cos' ? 2 * Math.PI : Math.PI;
    const nice = NICE[ES.fn].find(([t, v]) => Math.abs(v - a) < 0.006);
    const head = `<b>${esc(ES.fn)} x ${esc(ES.op)} ${esc(nice ? nice[0] : a.toFixed(2).replace('-', '−'))}</b><br>`;
    if (nice) {
      $('#av').textContent = nice[0];
      const c = OI.ineq(f, ES.fn + ' x', ES.op, nice[0], T), at = OI.atoms(c);
      $('#es').innerHTML = head + `[0; 2π] кесіндісінде: <b>${esc(OI.domStr(at))}</b><br>Жалпы шешім (n ∈ Z): <b>${esc(OI.genStr(at, T))}</b>`;
    } else {
      const A = a.toFixed(2).replace('-', '−'), st = ES.op === '>' || ES.op === '<', up = ES.op === '>' || ES.op === '≥';
      const L = st ? '(' : '[', Rb = st ? ')' : ']';
      const al = { sin: 'arcsin', cos: 'arccos', tg: 'arctg', ctg: 'arcctg' }[ES.fn] + '(' + A + ')';
      const deg = { sin: Math.asin(a), cos: Math.acos(a), tg: Math.atan(a), ctg: Math.PI / 2 - Math.atan(a) }[ES.fn] * 180 / Math.PI;
      const G = {
        sin: up ? `${L}${al} + 2πn; π − ${al} + 2πn${Rb}` : `${L}π − ${al} + 2πn; 2π + ${al} + 2πn${Rb}`,
        cos: up ? `${L}−${al} + 2πn; ${al} + 2πn${Rb}` : `${L}${al} + 2πn; 2π − ${al} + 2πn${Rb}`,
        tg: up ? `${L}${al} + πn; π/2 + πn)` : `(−π/2 + πn; ${al} + πn${Rb}`,
        ctg: up ? `(πn; ${al} + πn${Rb}` : `${L}${al} + πn; π + πn)`
      }[ES.fn];
      $('#es').innerHTML = head + `Жалпы шешім (n ∈ Z): <b>${esc(G)}</b><br><span class="m">${esc(al)} ≈ ${deg.toFixed(1).replace('-', '−')}°. Кестелік мәнді таңдасаң (жоғарыдағы батырмалар), жауап π арқылы дәл шығады.</span>`;
    }
  }
  fnE.onchange = () => { ES.fn = fnE.value; setRange(); draw(); };
  opE.onchange = () => { ES.op = opE.value; draw(); };
  aE.oninput = () => { ES.a = +aE.value; draw(); };
  tE.oninput = () => { ES.th = +tE.value; draw(); };
  const svg = $('#circ');
  const move = e => { const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * 340 / r.width - 170, y = (e.clientY - r.top) * 340 / r.height - 170; ES.th = Math.round(((Math.atan2(-y, x) * 180 / Math.PI) + 360) % 360); draw(); };
  svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); move(e); svg.onpointermove = move; });
  svg.addEventListener('pointerup', () => { svg.onpointermove = null; });
  setRange(); draw();
};

/* ================= Практика ================= */
const PR = { view: 'pick', sec: 'trig', topic: 1, level: 'auto', lvl: 'A', cs: 0, ws: 0, cur: null, hint: 0, sel: -1, done: false, mode: 'mc', assign: null, last: null };
/* Практика — тест варианты сияқты: деңгейдің барлық есебі бір тізім (алдымен шешілмегендері),
   әр есеп бір рет, алдыңғы/келесі есепке өтуге және нөмір арқылы секіруге болады. */
const shuf = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const levelList = (t, L) => (OI.bank[t] || []).filter(p => p.level === L);
function saveSt() { if (PR.cur) PR.st[PR.cur.id] = { sel: PR.sel, done: PR.done, res: PR.res, hint: PR.hint, ok: PR.ok }; }
function goTo(i) {
  PR.i = i; PR.cur = OI.byId[PR.list[i]];
  const st = PR.st[PR.cur.id] || {};
  PR.sel = st.sel === undefined ? -1 : st.sel; PR.done = !!st.done; PR.res = st.res || ''; PR.hint = st.hint || 0; PR.ok = !!st.ok;
}
function newVariant() {
  const L = PR.level === 'auto' ? PR.lvl : PR.level;
  const all = levelList(PR.topic, L);
  PR.st = {}; PR.L = L;
  if (!all.length) { PR.cur = null; PR.list = []; return; }
  const sv = solved();
  PR.list = [...shuf(all.filter(p => !sv.has(p.id)).map(p => p.id)), ...shuf(all.filter(p => sv.has(p.id)).map(p => p.id))];
  if (PR.list.length > 1 && PR.list[0] === PR.last) PR.list.push(PR.list.shift());
  goTo(0);
}
function practicePicker() {
  const sv = solved();
  const render = () => {
    main().innerHTML = `<div class="card"><h2>Практика</h2><p class="m">Бөлімді басып, тақырыпты таңда. Әр тақырыпта A, B, C деңгейлері бар.</p></div>` +
      sectionsHtml(PR.sec, t => { const b = OI.bank[t] || [], n = b.length, k = b.filter(p => sv.has(p.id)).length;
        return `<a class="tile" href="#/practice" data-tp="${t}"><b>${esc(topicName(t))}</b><span class="tl">${n} есеп · шешілгені ${k}</span></a>`; });
    $$('.sech').forEach(b => b.onclick = () => { PR.sec = PR.sec === b.dataset.s ? null : b.dataset.s; render(); });
    $$('[data-tp]').forEach(a => a.onclick = e => { e.preventDefault(); PR.topic = +a.dataset.tp; PR.cur = null; PR.assign = null; PR.view = 'solve'; VIEWS.practice(); scrollTo(0, 0); });
  };
  render();
}
VIEWS.practice = function () {
  if (PR.view !== 'solve' || (!PR.assign && !myTopics().includes(PR.topic))) { PR.view = 'pick'; return practicePicker(); }
  const SEC = OI.sectionOf(PR.topic); if (SEC) PR.sec = SEC.id;
  if (!PR.cur) newVariant();
  if (!PR.cur) { main().innerHTML = '<div class="card"><p>Бұл деңгейде есеп жоқ.</p></div>'; return; }

function ubtStart() {

/* ================= Калькулятор ================= */
const CALC = { e: '', r: '0', done: false };
function calcEval(src) {
  const t = []; let i = 0;
  const FN = ['log₂', 'sin', 'cos', 'tg', 'lg', 'ln', '√'];
  while (i < src.length) {
    const ch = src[i];
    if (/[0-9.]/.test(ch)) { let j = i; while (j < src.length && /[0-9.]/.test(src[j])) j++; const v = parseFloat(src.slice(i, j)); if (isNaN(v)) throw 0; t.push({ n: v }); i = j; continue; }
    if (ch === 'π') { t.push({ n: Math.PI }); i++; continue; }
    const f = FN.find(x => src.startsWith(x, i)); if (f) { t.push({ f }); i += f.length; continue; }
    if ('+−×÷^()'.includes(ch)) { t.push({ o: ch }); i++; continue; }
    if (ch === ' ') { i++; continue; }
    throw 0;
  }
  let p = 0;
  const pk = () => t[p], isO = c => pk() && pk().o === c;
  const R = Math.PI / 180;
  const F = { sin: x => Math.sin(x * R), cos: x => Math.cos(x * R), tg: x => Math.abs(Math.cos(x * R)) < 1e-12 ? NaN : Math.tan(x * R), lg: Math.log10, ln: Math.log, 'log₂': Math.log2, '√': Math.sqrt };
  function expr() { let v = term(); while (isO('+') || isO('−')) { const o = t[p++].o, r = term(); v = o === '+' ? v + r : v - r; } return v; }
  function term() { let v = unary(); for (; ;) { if (isO('×') || isO('÷')) { const o = t[p++].o, r = unary(); v = o === '×' ? v * r : v / r; } else if (pk() && (pk().n !== undefined || pk().f || isO('('))) v *= unary(); else break; } return v; }
  function unary() { if (isO('−')) { p++; return -unary(); } if (isO('+')) { p++; return unary(); } return power(); }
  function power() { const b = prim(); if (isO('^')) { p++; return Math.pow(b, unary()); } return b; }
  function prim() { const k = t[p++]; if (!k) throw 0; if (k.n !== undefined) return k.n; if (k.o === '(') { const v = expr(); if (isO(')')) p++; return v; } if (k.f) return F[k.f](power()); throw 0; }
  const v = expr(); if (p < t.length) throw 0; return v;
}
const calcFmt = v => { if (!isFinite(v)) return 'Қате'; if (Math.abs(v) < 1e-12) v = 0; let s = String(+v.toPrecision(10)); if (/e/.test(s)) s = v.toExponential(6); return s.replace('-', '−'); };
function calcShow() { $('#cE').textContent = CALC.e || ' '; $('#cR').textContent = CALC.r; }
function calcKey(k) {
  const OPS = ['+', '−', '×', '÷', '^'];
  if (k === 'C') { CALC.e = ''; CALC.r = '0'; CALC.done = false; }
  else if (k === '⌫') { if (CALC.done) { CALC.done = false; } const m = CALC.e.match(/(log₂\(|sin\(|cos\(|tg\(|lg\(|ln\(|√\()$/); CALC.e = m ? CALC.e.slice(0, -m[0].length) : CALC.e.slice(0, -1); }
  else if (k === '=') { if (!CALC.e) return; try { CALC.r = calcFmt(calcEval(CALC.e)); } catch (e) { CALC.r = 'Қате'; } CALC.done = true; }
  else {
    if (CALC.done) { CALC.e = OPS.includes(k) && CALC.r !== 'Қате' ? CALC.r : ''; CALC.done = false; }
    if (OPS.includes(k)) { if (!CALC.e && k !== '−') return; if (OPS.includes(CALC.e.slice(-1))) CALC.e = CALC.e.slice(0, -1); }
    CALC.e += k;
  }
  calcShow();
}
function ensureCalc() {
  if ($('#calcFab')) return;
  const keys = [['C', 'cl'], ['⌫', 'cl'], ['÷', 'op'], ['×', 'op'], ['7'], ['8'], ['9'], ['−', 'op'], ['4'], ['5'], ['6'], ['+', 'op'], ['1'], ['2'], ['3'], ['=', 'eq'], ['0', 'z'], ['.']];
  const fab = document.createElement('button'); fab.id = 'calcFab'; fab.className = 'calc-fab'; fab.title = 'Калькулятор'; fab.textContent = '🧮'; fab.hidden = true;
  const box = document.createElement('div'); box.id = 'calcBox'; box.className = 'calc'; box.hidden = true;
  box.innerHTML = `<div class="chd"><span>Калькулятор</span><button class="lnk" id="cX">Жабу ✕</button></div><div class="cd"><div class="ce" id="cE"> </div><div class="cres" id="cR">0</div></div><div class="ck">${keys.map(([k, c]) => `<button type="button" class="${c || ''}" data-k="${k}">${k}</button>`).join('')}</div>`;
  document.body.appendChild(fab); document.body.appendChild(box);
  fab.onclick = () => { box.hidden = !box.hidden; };
  $('#cX').onclick = () => { box.hidden = true; };
  box.querySelectorAll('[data-k]').forEach(b => b.onclick = e => { e.stopPropagation(); calcKey(b.dataset.k); });
}
function calcVisible(on) { ensureCalc(); $('#calcFab').hidden = !on; if (!on) $('#calcBox').hidden = true; }

/* ================= Іске қосу ================= */
async function boot() {
  try { S.me = await DB.restore(); if (S.me) await loadMine(); } catch (e) { S.me = null; }
  route();
}
boot();
